name: Quality branch validation

on:
  push:
    branches: [p094-quality-validation]
  pull_request:
    branches: [p094-quality-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALLOW_PAID_AI: '0'
      ENABLE_LIVE_PUBLISH: '0'
      VINTAGE_RUN_PREVIEW_HTTP_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile *.py
      - run: node --check static/mobile-upload.js
      - run: python -m unittest discover -v
