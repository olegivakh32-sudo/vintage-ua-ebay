name: LOTNEXO blind M12 acceptance

on:
  push:
    tags: [p094-lotnexo-m12-176340]

concurrency:
  group: p094-lotnexo-m12-176340
  cancel-in-progress: false

jobs:
  m12:
    if: >-
      github.repository == 'olegivakh32-sudo/vintage-ua-ebay' &&
      github.ref == 'refs/tags/p094-lotnexo-m12-176340' &&
      github.event.created && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: p094-vision-pilot
    permissions:
      contents: write
    env:
      ENABLE_LIVE_PUBLISH: '0'
      ALLOW_PAID_AI: '0'
      ALGORITHM_REVISION: e1255662c249e0c9f7574628b63ab0bd32bb8037
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ai_pilot.py
            /s1_acceptance.py
            /multiview_acceptance.py
            /test_artifacts/recognition/lotnexo-m12-plan.json
            /test_artifacts/recognition/lotnexo-multiview-independent-blind.zip
            /test_artifacts/recognition/M12_CHATGPT_PROMPT.txt
      - name: Isolate the frozen runtime and verify the blind archive
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lotnexo-m12"
          mkdir -m 700 "$root" "$root/runtime"
          git archive "$ALGORITHM_REVISION" -- '*.py' ':(exclude)test_*.py' catalogue_identifiers.json requirements.txt static workspace_web \
            | tar -x -C "$root/runtime"
          cp ai_pilot.py s1_acceptance.py multiview_acceptance.py "$root/runtime/"
          input="$root/runtime/test_artifacts/recognition"
          mkdir -p "$input"
          cp test_artifacts/recognition/{lotnexo-m12-plan.json,lotnexo-multiview-independent-blind.zip,M12_CHATGPT_PROMPT.txt} "$input/"
          cd "$root"
          if ! command -v tesseract >/dev/null; then
            timeout 60s sudo apt-get update -qq
            timeout 60s sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          fi
          python3 -m venv .venv
          timeout 180s .venv/bin/python -m pip install --quiet -r runtime/requirements.txt
          env -u PYTHONPATH .venv/bin/python runtime/multiview_acceptance.py > prepare.json
      - name: Verify model access without generation
        env:
          P094_PILOT_OPENAI_API_KEY: ${{ secrets.P094_PILOT_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lotnexo-m12"
          timeout 45s env -u PYTHONPATH .venv/bin/python runtime/multiview_acceptance.py --preflight preflight.json
      - name: Claim one execution across all runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 25s gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/p094-lotnexo-m12-176340-reserved -f sha="$GITHUB_SHA" > /dev/null
      - name: Run M12 and retain evidence
        env:
          P094_PILOT_OPENAI_API_KEY: ${{ secrets.P094_PILOT_OPENAI_API_KEY }}
          LOTNEXO_M12_RESERVED: 9598348a9bc03a72d0402ac1657245c1717c8e110abbdb035012b9611eb8e54a
          LOTNEXO_M12_APPROVED_USD: '1.76340'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lotnexo-m12"
          timeout 53m env -u PYTHONPATH .venv/bin/python runtime/multiview_acceptance.py --execute results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lotnexo-m12-evidence
          path: |
            ${{ runner.temp }}/lotnexo-m12/prepare.json
            ${{ runner.temp }}/lotnexo-m12/preflight.json
            ${{ runner.temp }}/lotnexo-m12/results/*.json
          retention-days: 30
          if-no-files-found: ignore
